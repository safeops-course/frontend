# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Repo-specific rules. Organization defaults (language, tone, workflows, Dockerfile, shell,
# *.example, CLAUDE/AGENT docs, pre-merge checks off, knowledge base scopes) come from
# safeops-course/coderabbit/.coderabbit.yaml through `inheritance: true`.
# CodeRabbit config for safeops-course/frontend (Vue 3 SPA served by nginx, SafeOps course).
# Every tool is enabled by default; only tools that need settings are listed below.
tone_instructions: "KISS: this is a small reference dashboard for a Kubernetes/SRE course. Focus on security, runtime config and nginx correctness; skip over-engineering and style nitpicks."
reviews:
  profile: chill
  request_changes_workflow: true
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # Default [] reviews only PRs into main; feature work lands in develop first.
    base_branches:
      - develop
  path_instructions:
    - path: "**"
      instructions: |
        Reference Vue 3 dashboard for a Kubernetes/SRE course: health probes, chaos controls,
        API explorer, environment view. Built with Vite, served by nginx, deployed by Flux from
        safeops-course/sre. Be strict on: XSS, secrets, hardcoded environment values, nginx
        security. Chaos controls (panic, delay, probe toggles) are intentional.
        No literal secrets, tokens or DSNs with credentials in src/, public/ or nginx/; the only config source is window.__ENV__ generated at container start.
    - path: "src/**"
      instructions: |
        - Vue 3 <script setup> (Composition API), Pinia 3, Vue Router 4, vue3-apexcharts.
        - Backend calls go through the axios client in src/services/api.js; do not add fetch/axios calls elsewhere.
        - Runtime config is read from window.__ENV__ (generated at container start), then import.meta.env,
          then a local-dev fallback. Never hardcode environment-specific URLs or hosts.
          Any new window.__ENV__ key must also be emitted by the config generator in the Dockerfile.
        - Tracing: OpenTelemetry web SDK in src/services/telemetry.js; use withSpan for new user actions.
        - The JWT is kept in localStorage (demo trade-off) - flag any v-html or other unescaped rendering of API data.
        - console.error in catch blocks is accepted; flag new console.log outside api.js/telemetry.js.
    - path: "src/style.css"
      instructions: |
        Tailwind CSS v4 CSS-first setup (@import "tailwindcss" + @source) through @tailwindcss/postcss.
        Put theme changes here with @theme, not in tailwind.config.js (v4 ignores it unless @config is used).
    - path: "Dockerfile"
      instructions: |
        - Multi-stage: node:24-alpine builder (npm ci + vite build), nginx:1.28-alpine runtime.
        - Runtime must stay non-root: appuser uid 10001 (group 10001). The Deployment in safeops-course/sre
          sets runAsUser 10001 and readOnlyRootFilesystem; only /tmp, /var/cache/nginx and /var/run are writable.
        - /docker-entrypoint.d/40-generate-env-config.sh writes window.__ENV__ to /tmp/config.js at start.
          Its key list must match what src/ reads from window.__ENV__.
        - Check: no extra packages in the runtime stage beyond curl for the HEALTHCHECK.
    - path: "nginx/**"
      instructions: |
        - SPA fallback to /index.html; /config.js served from /tmp/config.js (fallback: baked public/config.js) with no-cache;
          /api/ proxied to the in-namespace backend Service with the /api prefix stripped; /health for probes.
        - nginx add_header inheritance: a location that defines any add_header drops ALL server-level add_header
          directives. Security headers must be present in every location that sets its own headers.
        - Hashed static assets: long immutable cache; index.html and /config.js: no-cache.
        - Must keep listening on 8080 and work as a non-root user.
    - path: "{index.html,public/**}"
      instructions: |
        index.html loads /config.js before the app bundle; keep that order. public/config.js is only an empty fallback - never put real values in it.
    - path: "package.json"
      instructions: |
        Point out major-version bumps and packages that move between dependencies and devDependencies.
        Build tooling (vite, tailwindcss, postcss) belongs in devDependencies. package-lock.json must change with it.
    - path: ".github/workflows/**"
      instructions: |
        - build.yml (push to develop/main): multi-arch build amd64+arm64, push to GHCR, cosign keyless signing,
          SBOM attestation, Trivy image scan (report-only, exit-code 0).
        - promote-production.yml (manual): Trivy gate on CRITICAL (blocking), re-tag the staging image
          as production without rebuilding, GitHub Release, next patch tag.
        - Image tag format is `<env>-v<semver>-<shortsha>-<unix-ts>`; Flux ImagePolicies in
          safeops-course/sre and the promotion regex depend on it - flag any change.
        - Check: least-privilege permissions, no secrets echoed to logs, errors not swallowed.
  tools:
    # No ESLint config in the repo -> CodeRabbit skips ESLint; Biome runs with profile defaults on .vue/.js/.json/.css.
    # Oxlint is skipped while Biome is enabled.
    # Stylelint's generated default (stylelint-config-standard-scss) does not know Tailwind v4 at-rules
    # (@source, @theme) in src/style.css - needs verification on the first CSS PR; disable if it is only noise.
    stylelint:
      enabled: true
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - files: "TELEMETRY.md"
        applyTo: "src/services/telemetry.js,src/services/api.js,src/stores/**"
  linked_repositories:
    - repository: "safeops-course/sre"
      instructions: "Deploys this image with Flux: flux/apps/frontend/** (env VITE_API_URL=/api, VITE_UPTRACE_DSN, ENVIRONMENT, CLUSTER_NAME, VERSION; probes on /health; securityContext uid 10001 + readOnlyRootFilesystem; ImagePolicy tag regex). Check env var, port, probe and tag changes against it."
    - repository: "safeops-course/backend"
      instructions: "Go API behind nginx /api/. Routes are registered in pkg/server/server.go New(); check api.js calls against them."
chat:
  auto_reply: false
inheritance: true
