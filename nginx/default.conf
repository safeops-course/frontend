server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers: see security-headers.conf (included again in every location below,
    # because a location with its own add_header does not inherit these).
    include /etc/nginx/snippets/security-headers.conf;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Runtime environment config generated by entrypoint in writable /tmp.
    # Keep uncached to reflect current pod environment.
    location = /config.js {
        include /etc/nginx/snippets/security-headers.conf;
        root /;
        # Fallback to baked default file if runtime generation is unavailable.
        try_files /tmp/config.js /usr/share/nginx/html/config.js =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        default_type application/javascript;
    }

    # Reverse proxy to the backend - ONLY the routes the SPA calls (src/services/api.js).
    # Everything else under /api/ is a 404 from nginx, so a new or debug backend route never
    # reaches the internet by accident. Adding a route here makes it public: review it first.
    # Same origin as the SPA, so no CORS headers.
    # (quoted: an unquoted "{3}" would end the regex for the nginx parser)
    location ~ "^/api/(auth/(register|login|me)|healthz|readyz|readyz/(enable|disable)|livez|livez/(enable|disable)|version|env|headers|metrics|openapi|echo|panic|delay/[0-9.]+|status/[0-9]{3})$" {
        include /etc/nginx/snippets/security-headers.conf;

        # Strip /api and proxy to the backend service in the same namespace.
        # backend:80 resolves via ClusterIP DNS within the pod's namespace.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/json;
        return 404 '{"error":"not found"}';
    }

    # SPA routing - serve index.html for all routes
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Health check endpoint
    location = /health {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
