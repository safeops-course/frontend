# Security headers for every response. nginx drops ALL inherited add_header directives in a block
# that has its own add_header, so this file is included in the server block AND in every location.
# (Before 2026-09-27 the headers sat only in the server block and no response carried them.)

# The SPA loads only its own files; telemetry goes to Uptrace. 'unsafe-inline' for styles only:
# Vue style bindings and ApexCharts set inline styles. No inline or eval'd scripts.
# connect-src must match the collector origins src/services/telemetry.js accepts (self + Uptrace).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.uptrace.dev; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
