name: PR checks
run-name: "PR checks ${{ github.head_ref }}"

# Everything a change must pass before it can merge (security review 2026-09-27, plan S4).
# build.yml runs on pushes to main/develop and publishes the image; this workflow only verifies.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz

jobs:
  build:
    name: build (npm ci, build, audit)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; npm/go scripts get no token

      # Same Node major as the image builder stage (Dockerfile: node:24-alpine).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build

      # Fails on a HIGH/CRITICAL advisory in what ships to the browser. Dev-only tooling
      # (vite, rollup) is reported by a full `npm audit` but does not gate the merge.
      - name: npm audit (production dependencies)
        run: npm audit --audit-level=high --omit=dev

  image:
    name: image (docker build, nginx -t)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; npm/go scripts get no token

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only, never push: a broken Dockerfile fails the PR, not the deploy.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: frontend:pr-check
          platforms: linux/amd64
          cache-from: type=gha

      # The entrypoint scripts run first (they write /tmp/nginx-*.conf), then nginx -t.
      - name: nginx config test
        run: docker run --rm frontend:pr-check nginx -t

      # nginx resolves the backend per request (nginx/45-backend-upstream.sh): it must start without
      # one - /health 200, /api/ 502 - with a clean log (no warn/emerg/"can not modify"), and reach one
      # once it is there. Run as in the cluster: read-only root, tmpfs owned by the image's user.
      - name: starts without a backend, reaches it later, no warnings
        run: |
          set -euo pipefail
          opts=(--read-only --tmpfs /tmp:uid=10001,gid=10001 --tmpfs /var/cache/nginx:uid=10001,gid=10001
                --tmpfs /var/run:uid=10001,gid=10001)
          docker network create lazy >/dev/null
          docker run -d --name web --network lazy -p 18081:8080 "${opts[@]}" frontend:pr-check >/dev/null
          up=no
          for _ in $(seq 1 30); do curl -sf -o /dev/null localhost:18081/health && { up=yes; break; }; sleep 1; done
          [[ "${up}" == yes ]] || { echo "::error::no /health without a backend"; docker logs web; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' localhost:18081/api/healthz)"
          [[ "${code}" == 502 ]] || { echo "::error::/api/healthz without a backend: ${code}, want 502"; exit 1; }
          # A stand-in backend named "backend": any answer but 502 proves nginx found it.
          docker run -d --name backend --network lazy nginx:1.31-alpine >/dev/null
          code=502
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' localhost:18081/api/healthz)"; [[ "${code}" != 502 ]] && break; sleep 1
          done
          [[ "${code}" != 502 ]] || { echo "::error::/api/healthz still 502 after the backend started"; docker logs web; exit 1; }
          logs="$(docker logs web 2>&1)"
          docker rm -f web backend >/dev/null; docker network rm lazy >/dev/null
          echo "without a backend: 502; with it: ${code}"
          if grep -E '\[(warn|emerg)\]|can not modify' <<<"${logs}"; then echo "::error::warnings at start"; exit 1; fi
          # Kubernetes service links: every pod started after the Service "backend" exists gets
          # BACKEND_PORT=tcp://<ip>:80 and friends. They must not change or stop the start.
          # BACKEND_HOST is not a service link: it was this image's old knob, set so it cannot return unnoticed.
          links=(-e BACKEND_PORT=tcp://10.96.0.10:80 -e BACKEND_PORT_80_TCP=tcp://10.96.0.10:80
                 -e BACKEND_SERVICE_HOST=10.96.0.10 -e BACKEND_SERVICE_PORT=80 -e BACKEND_HOST=10.96.0.10)
          docker run -d --name links "${opts[@]}" "${links[@]}" frontend:pr-check >/dev/null
          up=no
          for _ in $(seq 1 30); do docker exec links curl -sf -o /dev/null localhost:8080/health && { up=yes; break; }; sleep 1; done
          conf="$(docker exec links cat /tmp/nginx-backend.conf 2>/dev/null || true)"
          links_log="$(docker logs links 2>&1)"
          docker rm -f links >/dev/null
          [[ "${up}" == yes ]] || { echo "::error::no start with Kubernetes service-link variables"; echo "${links_log}"; exit 1; }
          if grep -E '\[(warn|emerg)\]|can not modify' <<<"${links_log}"; then echo "::error::warnings at start with service-link variables"; exit 1; fi
          grep -q 'default "backend:80";' <<<"${conf}" \
            || { echo "::error::service-link variables changed the upstream:"; echo "${conf}"; exit 1; }
          echo "service-link variables: ignored, upstream backend:80"

      # RANDOM_ERROR_RATE (nginx/50-fault-injection.sh): run as in the cluster - read-only root,
      # writable tmpfs owned by the image's user - and count 100 answers per case.
      - name: RANDOM_ERROR_RATE - off, all, a share; /health spared; invalid values refused
        run: |
          set -euo pipefail
          opts=(--read-only -p 18080:8080
                --tmpfs /tmp:uid=10001,gid=10001 --tmpfs /var/cache/nginx:uid=10001,gid=10001
                --tmpfs /var/run:uid=10001,gid=10001)
          count() {  # count <path> <code>: how many of 100 requests answered <code>
            local n=0
            for _ in $(seq 1 100); do
              [[ "$(curl -s -o /dev/null -w '%{http_code}' "localhost:18080$1")" == "$2" ]] && n=$((n + 1))
            done
            echo "${n}"
          }
          check() {  # check <rate> <min> <max>: 500s on / within [min, max]; /health always 200
            docker run -d --name fault "${opts[@]}" ${1:+-e RANDOM_ERROR_RATE=$1} frontend:pr-check >/dev/null
            local up=no
            for _ in $(seq 1 30); do curl -sf -o /dev/null localhost:18080/health && { up=yes; break; }; sleep 1; done
            if [[ "${up}" != yes ]]; then
              echo "::error::RANDOM_ERROR_RATE='$1': /health never answered 200"; docker logs fault; docker rm -f fault >/dev/null; exit 1
            fi
            local errors health_ok
            errors="$(count / 500)"; health_ok="$(count /health 200)"
            docker rm -f fault >/dev/null
            echo "RANDOM_ERROR_RATE='$1': / ${errors}/100 errors, /health ${health_ok}/100 OK"
            (( errors >= $2 && errors <= $3 && health_ok == 100 )) || { echo "::error::RANDOM_ERROR_RATE='$1': want $2-$3 errors on / and /health 200 every time"; exit 1; }
          }
          check "" 0 0
          check 0 0 0
          check 1 100 100
          check 0.3 10 50
          for bad in abc 1.5 -0.1 '30%'; do
            if docker run --rm "${opts[@]}" -e RANDOM_ERROR_RATE="${bad}" frontend:pr-check nginx -t >/dev/null 2>&1; then
              echo "::error::RANDOM_ERROR_RATE='${bad}' was accepted"; exit 1
            fi
            echo "RANDOM_ERROR_RATE='${bad}': refused"
          done

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          rm "${archive}"

      # Only the commits of this PR, including what a merge commit changes (first-parent diff:
      # e.g. a conflict resolution). --redact keeps any finding's value out of the log.
      - name: Scan the PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --no-banner --redact --exit-code 1 --log-opts="--diff-merges=first-parent ${BASE_SHA}..${HEAD_SHA}" .
