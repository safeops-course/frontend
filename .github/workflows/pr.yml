name: PR checks
run-name: "PR checks ${{ github.head_ref }}"

# Everything a change must pass before it can merge (security review 2026-09-27, plan S4).
# build.yml runs on pushes to main/develop and publishes the image; this workflow only verifies.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz

jobs:
  build:
    name: build (npm ci, build, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; npm/go scripts get no token

      # Same Node major as the image builder stage (Dockerfile: node:24-alpine).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build

      # Fails on a HIGH/CRITICAL advisory in what ships to the browser. Dev-only tooling
      # (vite, rollup) is reported by a full `npm audit` but does not gate the merge.
      - name: npm audit (production dependencies)
        run: npm audit --audit-level=high --omit=dev

  image:
    name: image (docker build, nginx -t)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; npm/go scripts get no token

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only, never push: a broken Dockerfile fails the PR, not the deploy.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: frontend:pr-check
          platforms: linux/amd64
          cache-from: type=gha

      # nginx resolves the proxy upstream "backend" at startup; in the cluster that is the Service.
      - name: nginx config test
        run: docker run --rm --add-host backend:127.0.0.1 frontend:pr-check nginx -t

      # RANDOM_ERROR_RATE (nginx/50-fault-injection.sh): run as in the cluster - read-only root,
      # writable tmpfs owned by the image's user - and count 100 answers per case.
      - name: RANDOM_ERROR_RATE - off, all, a share; /health spared; invalid values refused
        run: |
          set -euo pipefail
          opts=(--read-only --add-host backend:127.0.0.1 -p 18080:8080
                --tmpfs /tmp:uid=10001,gid=10001 --tmpfs /var/cache/nginx:uid=10001,gid=10001
                --tmpfs /var/run:uid=10001,gid=10001)
          count() {  # count <path> <code>: how many of 100 requests answered <code>
            local n=0
            for _ in $(seq 1 100); do
              [[ "$(curl -s -o /dev/null -w '%{http_code}' "localhost:18080$1")" == "$2" ]] && n=$((n + 1))
            done
            echo "${n}"
          }
          check() {  # check <rate> <min> <max>: 500s on / within [min, max]; /health always 200
            docker run -d --name fault "${opts[@]}" ${1:+-e RANDOM_ERROR_RATE=$1} frontend:pr-check >/dev/null
            local up=no
            for _ in $(seq 1 30); do curl -sf -o /dev/null localhost:18080/health && { up=yes; break; }; sleep 1; done
            if [[ "${up}" != yes ]]; then
              echo "::error::RANDOM_ERROR_RATE='$1': /health never answered 200"; docker logs fault; docker rm -f fault >/dev/null; exit 1
            fi
            local errors health_ok
            errors="$(count / 500)"; health_ok="$(count /health 200)"
            docker rm -f fault >/dev/null
            echo "RANDOM_ERROR_RATE='$1': / ${errors}/100 errors, /health ${health_ok}/100 OK"
            (( errors >= $2 && errors <= $3 && health_ok == 100 )) || { echo "::error::RANDOM_ERROR_RATE='$1': want $2-$3 errors on / and /health 200 every time"; exit 1; }
          }
          check "" 0 0
          check 0 0 0
          check 1 100 100
          check 0.3 10 50
          for bad in abc 1.5 -0.1 '30%'; do
            if docker run --rm "${opts[@]}" -e RANDOM_ERROR_RATE="${bad}" frontend:pr-check nginx -t >/dev/null 2>&1; then
              echo "::error::RANDOM_ERROR_RATE='${bad}' was accepted"; exit 1
            fi
            echo "RANDOM_ERROR_RATE='${bad}': refused"
          done

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          rm "${archive}"

      # Only the commits of this PR, including what a merge commit changes (first-parent diff:
      # e.g. a conflict resolution). --redact keeps any finding's value out of the log.
      - name: Scan the PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --no-banner --redact --exit-code 1 --log-opts="--diff-merges=first-parent ${BASE_SHA}..${HEAD_SHA}" .
